<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Class Games</title>
<style>
:root{--bg:#fff;--fg:#2b2f36;--cd:#f3f6fb;--y:#fac564;--b:#1e7ff0;--bd:#cfd6df}
body.dk{--bg:#14181f;--fg:#eef1f6;--cd:#222a36;--bd:#3a4556}
*{box-sizing:border-box;margin:0}
body{font-family:"Vazirmatn","Trebuchet MS",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:0 16px;background:var(--b);color:#fff;font-weight:700;transition:transform .15s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:scale(.95)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #ffb000;outline-offset:2px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg)}
textarea{min-height:140px;resize:vertical}
input[type=checkbox]{width:26px;min-height:26px;accent-color:var(--b)}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
label.ck{flex-direction:row;align-items:center;gap:10px;min-height:48px}
.g{background:#e4e7ec;color:#333}.r{background:#e5484d}.n{background:#238a52}.y{background:var(--y);color:#222}
header{background:var(--y);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#222;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
header h1{font-size:22px;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
header button{background:#fff;color:#222;min-width:48px;padding:0 10px}
header input{max-width:260px;flex:1 1 160px;background:#fffd;color:#222}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#1e7ff0,#e5484d);display:grid;place-items:center;color:#fff;font-size:20px}
.pg{max-width:980px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--cd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px #0002;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0003}
.card .ic{font-size:54px;height:96px;display:grid;place-items:center}
.card .bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .bd p{flex:1;font-size:14px}
.dots{letter-spacing:2px;color:#e08a00}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-height:40px;background:var(--cd);color:var(--fg);border:2px solid var(--bd)}.chips button.on{background:var(--b);color:#fff;border-color:var(--b)}
.sb{display:flex;gap:8px;flex-wrap:wrap}.sb div{flex:1;min-width:84px;text-align:center;border-radius:14px;padding:6px;background:var(--cd);font-weight:800;font-size:17px;border:3px solid transparent;overflow:hidden;text-overflow:ellipsis}
.sb .on{background:var(--y);color:#222;border-color:#e5484d}.sb b{display:block;font-size:28px}
.tb{display:flex;gap:8px;flex-wrap:wrap}.tb button{flex:1;min-width:100px}
.tiles{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px}
.tile{height:var(--h,min(20vw,100px));font-size:30px;color:#fff;box-shadow:0 4px 0 #0003;animation:pop .35s backwards}
.tile:nth-child(8n+1){background:#1e7ff0}.tile:nth-child(8n+2){background:#7a4fe0}.tile:nth-child(8n+3){background:#e5484d}.tile:nth-child(8n+4){background:#e08a00}.tile:nth-child(8n+5){background:#238a52}.tile:nth-child(8n+6){background:#0e9aa7}.tile:nth-child(8n+7){background:#c93f8e}.tile:nth-child(8n+8){background:#5b6b82}
.tile.u{background:var(--cd);color:#9996;box-shadow:none}
.jr .tile{height:var(--h,min(28vw,150px));font-size:56px;border-radius:26px}.jr .md{font-size:1.25em}.jr button{min-height:64px;font-size:22px}
.jr{background:linear-gradient(#fff4d6,#d9ecff);border-radius:24px;padding:10px}body.dk .jr{background:linear-gradient(#2b2540,#16283d)}
.bigimg{font-size:90px;line-height:1}.qimg{max-width:100%;max-height:200px;border-radius:12px;margin:0 auto}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}.ttt button{height:min(28vw,130px);font-size:56px;background:var(--cd);color:var(--fg);padding:0}
.wn{animation:pulse .7s infinite alternate;background:#c8f0d8!important}@keyframes pulse{to{transform:scale(1.1)}}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#1e5fb4;padding:6px;border-radius:14px;max-width:560px;margin:0 auto;width:100%}
.c4 button{aspect-ratio:1;min-height:0;padding:0;border-radius:50%;background:#fff}.c4 .p0{background:#e5484d}.c4 .p1{background:#fac564}.c4 .wn{outline:4px solid #fff}
.mem{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px;perspective:900px}
.mc{position:relative;height:min(22vw,110px);padding:0;background:none;transform-style:preserve-3d;transition:transform .45s}
.mc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;padding:4px;font-size:clamp(11px,2.6vw,16px);overflow:hidden;word-break:break-word}
.mc .fr{background:linear-gradient(135deg,#1e90ff,#7a4fe0);color:#fff;font-size:28px}.mc .bk{background:var(--cd);color:var(--fg);transform:rotateY(180deg);border:2px solid var(--b)}
.mc.o{transform:rotateY(180deg)}.mc.m .bk{background:#c8f0d8;color:#143;border-color:#238a52}
.bg{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:5px}
.bg button{min-height:56px;padding:4px;font-size:clamp(11px,2.4vw,15px);background:var(--cd);color:var(--fg);border:2px solid var(--bd);word-break:break-word}
.bg button.k{background:#238a52;color:#fff;border-color:#238a52}.bg button.w{background:#fac564;color:#222;animation:pulse .7s infinite alternate}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sn{position:relative;width:100%;max-width:620px;margin:0 auto;aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px #0003}
.sn .cl{position:absolute;display:grid;gap:0;inset:0;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.sn .cl i{font-style:normal;font-size:clamp(7px,1.8vw,12px);padding:2px;color:#0008;border:1px solid #fff6}
.sn .cl i:nth-child(odd){background:#c9e7ff}.sn .cl i:nth-child(even){background:#fff0c9}
.sn svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tk{position:absolute;width:5.2%;height:5.2%;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(8px,2vw,14px);transition:left .22s,top .22s;transform:translate(-50%,-50%);box-shadow:0 2px 4px #0006}
.die{width:84px;height:84px;font-size:20px;background:var(--cd);color:var(--fg);border:3px solid var(--b);border-radius:18px;display:grid;place-items:center;padding:0;line-height:1.1}
.die b{font-size:40px;display:block;text-align:center}.die small{font-size:12px;display:block;text-align:center}
.dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.rolling .die{animation:roll .25s infinite}
@keyframes roll{50%{transform:rotate(14deg) scale(1.08)}}
.d6{width:76px;height:76px;font-size:44px;margin:0 auto}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;overflow:auto}
.md{background:var(--bg);color:var(--fg);border-radius:22px;padding:18px;width:min(560px,100%);max-height:94dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .25s}
.md h2{font-size:26px}.md h3{font-size:18px}.md.tl{text-align:start}
.ans{background:#eaf3ff;color:#0b5cc4;font-weight:800;font-size:24px;border-radius:12px;padding:10px}
.ex{font-size:14px;opacity:.85}
.opts{display:grid;gap:6px}.opts div{background:var(--cd);border-radius:10px;padding:8px;font-weight:700}
.opts button{background:var(--cd);color:var(--fg);border:2px solid var(--bd);min-height:52px}.opts button.ok{background:#c8f0d8;color:#143;border-color:#238a52}.opts button.no{background:#ffd9d9;color:#611;border-color:#e5484d}
.win{font-size:30px;font-weight:900;text-align:center;animation:pop .6s}
.it{display:flex;gap:8px;align-items:center;background:var(--cd);padding:8px 12px;border-radius:12px}.it span{flex:1;min-width:0;word-break:break-word}
.tm{height:10px;background:var(--cd);border-radius:6px;overflow:hidden}.tm i{display:block;height:100%;background:#e08a00;transition:width 1s linear}
.timer{font-size:28px;font-weight:900;color:#e08a00}
.box{background:var(--cd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rank{display:flex;gap:10px;align-items:center;background:var(--cd);border-radius:12px;padding:8px 12px;font-weight:800}.rank b{margin-inline-start:auto;font-size:22px}
.toast{position:fixed;bottom:16px;inset-inline:12px;margin:auto;max-width:480px;background:#222;color:#fff;border-radius:14px;padding:12px 16px;z-index:40;white-space:pre-line;animation:pop .2s}
.conf{position:fixed;top:-30px;font-size:26px;z-index:30;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.prog{height:8px;background:var(--cd);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
small{opacity:.8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.na *{animation:none!important;transition:none!important}

function lines(w,h,k){const L=[];for(let r=0;r<h;r++)for(let c=0;c<w;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const s=[];for(let i=0;i<k;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=h||cc<0||cc>=w)break;s.push(rr*w+cc)}if(s.length===k)L.push(s)}return L}
const L3=lines(3,3,3),L4=lines(7,6,4);
function endIf(L){for(const l of L){const v=G.b[l[0]];if(v!==null&&l.every(i=>G.b[i]===v)){G.over=v;G.line=l;G.sc[v]++;win();return true}}if(G.b.every(x=>x!==null)){G.over="d";SFX.no();return true}return false}

const LAD={2:23,8:34,20:42,28:76,51:67,71:91},SNK={27:5,40:3,43:18,54:31,66:45,89:53,95:77,99:41},SL={...LAD,...SNK};
function sqXY(n){n=Math.max(1,n);const r=Math.floor((n-1)/10),c=r%2===0?(n-1)%10:9-(n-1)%10;return[(c+.5)*10,(9-r+.5)*10]}
function tkXY(i,n){const[x,y]=sqXY(n);return[x+((i%4)-1.5)*1.3,y+(Math.floor(i/4)-.5)*2]}
function snakeSvg(){let s="";Object.entries(LAD).forEach(([a,b])=>{const[x1,y1]=sqXY(+a),[x2,y2]=sqXY(+b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*1.1,ny=dx/L*1.1;
  s+=`<line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke="#8a5a2b" stroke-width=".8" stroke-linecap="round"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke="#8a5a2b" stroke-width=".8" stroke-linecap="round"/>`;
  for(let k=1;k<Math.floor(L/3.2);k++){const f=k*3.2/L;s+=`<line x1="${x1+dx*f+nx}" y1="${y1+dy*f+ny}" x2="${x1+dx*f-nx}" y2="${y1+dy*f-ny}" stroke="#b9854a" stroke-width=".7" stroke-linecap="round"/>`}});
 Object.entries(SNK).forEach(([a,b],k)=>{const[x1,y1]=sqXY(+a),[x2,y2]=sqXY(+b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*9,ny=dx/L*9,col=["#2fa35b","#8a4fd6","#e5833a","#1e9fb0"][k%4];
  s+=`<path d="M${x1} ${y1} C${x1+dx*.33+nx} ${y1+dy*.33+ny} ${x1+dx*.66-nx} ${y1+dy*.66-ny} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" opacity=".92"/><circle cx="${x1}" cy="${y1}" r="1.9" fill="${col}"/><circle cx="${x1-.5}" cy="${y1-.4}" r=".4" fill="#fff"/><circle cx="${x1+.5}" cy="${y1-.4}" r=".4" fill="#fff"/>`});
 return`<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`}

GA.roll=()=>{if(G.busy||G.over!=null)return;G.busy=true;const g=G,rb=$("rb");if(rb)rb.disabled=true;const F="⚀⚁⚂⚃⚄⚅",r=1+rnd(6);let k=0;

function afterRoll(g,r){if(G!==g)return;const p=G.sc[G.cur];

function walk(g,r,back){const i=G.cur,dir=r>0?1:-1;let left=Math.abs(r);const step=()=>{if(G!==g)return;if(left>0){left--;G.sc[i]=Math.min(100,G.sc[i]+dir);SFX.tile();snSync();setTimeout(step,S.anim?230:20)}else land()};

 <div class="row"><label>${t("qtype")}<select id="et">${TYPES.map(x=>`<option value="${x}" ${d.type===x?"selected":""}>${t("t_"+x)}</option>`).join("")}</select></label><label>${t("pts_")}<input id="ep" type="number" min="1" max="100" value="${d.pts||1}"></label><label>${t("cat")}<input id="ec" list="cl" value="${esc(d.cat||"")}" maxlength="40"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label></div>
 <label>${t("opts_")}<textarea id="eo" style="min-height:80px">${esc((d.opts||[]).join("\n"))}</textarea></label><label>${t("expl")}<input id="ex" value="${esc(d.expl||"")}" maxlength="300"></label>
 <label>${t("image")}<input id="ei" type="file" accept="image/*"></label>${img?`<div class="row" style="flex-wrap:nowrap">${isEmoji(img)?`<span class="bigimg" style="font-size:48px;flex:0 0 auto">${esc(img)}</span>`:`<img class="qimg" style="max-height:90px;flex:0 0 auto;margin:0" src="${esc(img)}" alt="">`}<button class="g" data-a="rmimg" style="flex:0 0 auto">${t("rmimg")}</button></div>`:""}
 <div class="row"><button class="n" data-a="addq">${E.ed>=0?"💾 "+t("upd"):"➕ "+t("add")}</button>${E.ed>=0?`<button class="g" data-a="cedit">${t("cancelE")}</button>`:""}</div></div>
 <div class="row"><input id="esr" type="search" placeholder="${t("search")}" value="${esc(E.q)}" aria-label="${t("search")}"><select id="eft" aria-label="${t("qtype")}"><option value="all">${t("all")}</option>${TYPES.map(x=>`<option value="${x}" ${E.ft===x?"selected":""}>${t("t_"+x)}</option>`).join("")}</select></div>
 <div id="ql" style="display:flex;flex-direction:column;gap:8px">${qlistHtml()}</div>
 <div class="box"><div class="row"><button data-a="exj">⬇ ${t("exp")} JSON</button><button data-a="exc">⬇ ${t("exp")} CSV</button><button data-a="imp">⬆ ${t("imp")} (JSON/CSV)</button></div><input id="fl" type="file" accept=".json,.csv,application/json,text/csv" hidden><button class="g" data-a="rest">${t("rest")}</button></div></div>`};
const isFalseW=["false","f","no","0","غلط","خیر","نادرست"];
function readForm(){const g=id=>($(id)||{}).value||"";return{q:g("eq"),a:g("ea"),type:g("et")||"auto",pts:g("ep"),cat:g("ec"),opts:g("eo").split("\n"),expl:g("ex"),img:E.img}}
function validQ(o){o=normQ(o);if(!o.q||!o.a)return[null,t("need_q")];
 if(o.type==="mc"){if(!o.opts.some(x=>norm(x)===norm(o.a)))o.opts.push(o.a);if(o.opts.length<2)return[null,t("need_opts")]}
 if(o.type==="tf"){const n=norm(o.a);if(TRUE_W.includes(n))o.a=S.lang==="fa"?"درست":"True";else if(isFalseW.includes(n))o.a=S.lang==="fa"?"غلط":"False";else return[null,t("need_tf")]}
 if(o.type!=="mc")o.opts=o.opts.length&&o.type==="auto"?o.opts:[];return[o,null]}
Object.assign(A,{
 nset(){const n=($("sn").value||"").trim();if(!n){toast(t("name"));return}const id="s"+Date.now();S.sets.push({id,name:n,lang:S.lang,qs:[]});S.cur=id;save();render()},
 rset(){const n=($("sn").value||"").trim();if(!n){toast(t("name"));return}cs().name=n;save();render()},
 dup(){const s=cs(),id="s"+Date.now();S.sets.push({id,name:s.name+" (copy)",lang:s.lang,qs:structuredClone(s.qs)});S.cur=id;save();render()},
 dset(){if(S.sets.length<2){toast(t("sure")+" — min 1");return}ask(()=>{S.sets=S.sets.filter(x=>x.id!==S.cur);S.cur=S.sets[0].id;E.ed=-1;E.dr=null;E.img="";save();render()})},
 addq(){const[o,er]=validQ(readForm());if(er){toast(er);return}if(E.ed>=0&&cs().qs[E.ed])cs().qs[E.ed]=o;else cs().qs.push(o);E.ed=-1;E.dr=null;E.img="";save();render();SFX.ok()},
 eq(b){E.ed=+b.dataset.i;E.dr=null;E.img=cs().qs[E.ed].img||"";render();window.scrollTo(0,0)},
 cedit(){E.ed=-1;E.dr=null;E.img="";render()},rmimg(){E.dr=readForm();E.dr.img=E.img="";render()},
 dq(b){ask(()=>{cs().qs.splice(+b.dataset.i,1);if(E.ed>=0){E.ed=-1;E.dr=null;E.img=""}save();render()})},
 imp(){$("fl").value="";$("fl").click()},
 exj(){dl(cs().name+".json",JSON.stringify({name:cs().name,lang:cs().lang,qs:cs().qs},null,2),"application/json")},
 exc(){const c=v=>'"'+String(v).replace(/"/g,'""')+'"';dl(cs().name+".csv","﻿"+["q,a,type,options,pts,explanation,category,image"].concat(cs().qs.map(x=>[x.q,x.a,x.type,x.opts.join("|"),x.pts,x.expl,x.cat,x.img].map(c).join(","))).join("\r\n"),"text/csv")}});
function dl(name,text,mime){if(window.Android&&Android.save){try{const p=Android.save(name.replace(/[\\/:*?"<>|]/g,"_"),text);toast("✔ "+p);return}catch(e){}}try{const u=URL.createObjectURL(new Blob([text],{type:mime+";charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=name.replace(/[\\/:*?"<>|]/g,"_");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast("Export unsupported")}}
function parseCSV(s){const rows=[];let r=[],c="",q=false;s=s.replace(/^﻿/,"");for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","||ch===";"&&!s.includes(","))(r.push(c),c="");else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
function importText(name,txt){let items,setName=null,lang=null;
 if(/\.csv$/i.test(name)){const rows=parseCSV(txt);if(!rows.length)throw new Error(t("bad_none"));const h=rows[0].map(x=>norm(x));let map=["q","a","type","opts","pts","expl","cat","img"],start=0;
  if(["q","question","سوال","سؤال"].includes(h[0])){start=1;const al={q:["q","question"],a:["a","answer"],type:["type"],opts:["options","opts"],pts:["pts","points"],expl:["explanation","expl"],cat:["category","cat"],img:["image","img"]};map=Object.keys(al).map(k=>{const i=h.findIndex(x=>al[k].includes(x));return i});
   if(map[0]<0)map[0]=0;if(map[1]<0)map[1]=1}
  items=rows.slice(start).map(r=>{const o={};["q","a","type","opts","pts","expl","cat","img"].forEach((k,j)=>{o[k]=map[j]>=0?(r[map[j]]??""):""});return o})}
 else if(/\.json$/i.test(name)||/^\s*[\[{]/.test(txt)){let j;try{j=JSON.parse(txt)}catch(e){throw new Error(t("bad_json"))}
  if(Array.isArray(j))items=j;else if(j&&typeof j==="object"&&(Array.isArray(j.qs)||Array.isArray(j.questions))){items=j.qs||j.questions;setName=typeof j.name==="string"?j.name.slice(0,50):null;lang=j.lang==="fa"?"fa":"en"}else throw new Error(t("bad_json")+": [{q,a}] / {name,qs:[]}")}
 else throw new Error(t("bad_type"));
 const ok=[],err=[];items.forEach((x,i)=>{if(!x||typeof x!=="object"){err.push(`#${i+1}: ${t("need_q")}`);return}
  let op=x.opts??x.options??[];if(!Array.isArray(op))op=String(op).split("|");const[o,er]=validQ({q:x.q??x.question,a:x.a??x.answer,type:x.type,opts:op,pts:x.pts??x.points,expl:x.expl??x.explanation,cat:x.cat??x.category,img:x.img??x.image});er?err.push(`#${i+1}: ${er}`):ok.push(o)});
 return{ok,err,setName,lang}}
function doImport(f){if(f.size>3e6){toast("File too large (max 3 MB)");return}const r=new FileReader();r.onerror=()=>toast(t("bad_json"));r.onload=()=>{try{const{ok,err,setName,lang}=importText(f.name,String(r.result));
  if(!ok.length){info(`<h2>⚠ ${t("bad_none")}</h2>${err.length?`<div class="it" style="flex-direction:column;align-items:stretch;text-align:start">${err.slice(0,8).map(e=>`<small>${esc(e)}</small>`).join("")}</div>`:""}`,"OK");return}
  if(setName){const id="s"+Date.now();S.sets.push({id,name:setName,lang,qs:ok});S.cur=id}else cs().qs.push(...ok);save();render();
  if(err.length)info(`<h2>✔ ${ok.length} ${t("imported")} · ✖ ${err.length} ${t("skipped")}</h2><div class="it" style="flex-direction:column;align-items:stretch;text-align:start">${err.slice(0,8).map(e=>`<small>${esc(e)}</small>`).join("")}${err.length>8?"<small>…</small>":""}</div>`,"OK");else toast("✔ "+ok.length+" "+t("imported"))}
  catch(e){info(`<h2>⚠ ${esc(e.message||t("bad_json"))}</h2>`,"OK")}};r.readAsText(f)}
/* ===== events ===== */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener("input",e=>{const el=e.target;
 if(el.id==="sr"){S.srch=el.value;const l=$("lib");if(l)l.innerHTML=libHtml()}
 else if(el.classList.contains("tn")){S.tn[+el.dataset.i]=el.value.trim()||"Team "+(+el.dataset.i+1);save()}
 else if(el.id==="stx"&&G)G.txt=el.value;else if(el.id==="stt"&&G)G.title=el.value;
 else if(el.id==="esr"){E.q=el.value;$("ql").innerHTML=qlistHtml()}});
document.addEventListener("change",e=>{const el=e.target;
 if(el.id==="st"){S.cur=el.value;save();E.ed=-1;E.dr=null;E.img="";render()}
 else if(el.id==="gm"){S.gm=el.value;save();render()}
 else if(el.id==="fdiff"){S.fdiff=el.value;save();render()}else if(el.id==="slang"){S.slang=el.value;save();render()}
 else if(el.id==="sl"){cs().lang=el.value;save()}else if(el.id==="eft"){E.ft=el.value;$("ql").innerHTML=qlistHtml()}
 else if(el.id==="stm"&&G)G.team=+el.value;
 else if(el.id==="fl"){const f=el.files[0];if(f)doImport(f)}
 else if(el.id==="ei"){const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast(t("bad_type"));return}if(f.size>300*1024){toast(t("bigimg"));el.value="";return}const r=new FileReader();r.onload=()=>{E.dr=readForm();E.img=E.dr.img=String(r.result);render()};r.readAsDataURL(f)}
 else if(el.dataset.k){const k=el.dataset.k,ty=el.dataset.t;let v=ty==="b"?el.checked:ty==="n"?(parseInt(el.value)||0):el.value;
  if(ty==="n"&&SP[k]&&SP[k].n)v=Math.max(SP[k].n[0],Math.min(SP[k].n[1],v));S[k]=v;if(k==="nt")S.nt=Math.max(1,v);save();const set=$("dlg").querySelector("[data-set]");render();if(set)A.settings()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(G&&G.busy)return;closeDlg();return}
 if(e.key==="Enter"){if(e.target.id==="qo"){e.preventDefault();A.qs()}else if(e.target.id==="sn"){e.preventDefault();A.nset()}}});
new MutationObserver(()=>{const d=$("dlg");if(d.firstChild&&!d.contains(document.activeElement)){const b=d.querySelector("button,input,select");b&&b.focus()}}).observe($("dlg"),{childList:true});
window.addEventListener("beforeunload",tmStop);
window.__back=()=>{if($("dlg").firstChild){if(!(G&&G.busy))closeDlg();return true}if(scr!=="home"){A.home();return true}return false};
/* D-pad / TV remote navigation */
document.addEventListener("keydown",e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!d||e.defaultPrevented)return;const a=document.activeElement,tg=a&&a.tagName,ty=a&&a.type;
 if(tg==="TEXTAREA"||(tg==="INPUT"&&/^(text|search|number)$/.test(ty)&&d[0]))return;
 const root=$("dlg").firstChild?$("dlg"):document;const els=[...root.querySelectorAll("button:not(:disabled),input:not([hidden]),select,textarea")].filter(x=>x.getClientRects().length);
 const cur=a&&els.includes(a)?a:null;if(!cur){if(els[0]){e.preventDefault();els[0].focus()}return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const x of els){if(x===cur)continue;const q=x.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,f=d[0]?dx*d[0]:dy*d[1];if(f<=2)continue;const s=f+(d[0]?Math.abs(dy):Math.abs(dx))*2.5;if(s<bs){bs=s;best=x}}
 if(best){e.preventDefault();best.focus();best.scrollIntoView({block:"nearest"})}});
render();
